[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openciclo"
version = "0.2.1"
description = "Open-source, privacy-first menstrual-cycle forecasting engine."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [
    { name = "Emma Flora Harbison" },
    { name = "Luis Rey Sánchez" },
]
keywords = [
    "menstrual-cycle",
    "forecasting",
    "privacy",
    "local-first",
    "statistics",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "pydantic>=2.6",
    "scipy>=1.11",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.8",
    "pandas-stubs>=2.1",
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.urls]
Homepage = "https://github.com/OpenCiclo/openciclo"
Documentation = "docs/"
License = "LICENSE"

[tool.hatch.build.targets.wheel]
packages = ["openciclo"]

[tool.hatch.build.targets.wheel.force-include]
"openciclo/artifacts/released_model.json" = "openciclo/artifacts/released_model.json"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["openciclo", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["openciclo"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["B011"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.12"
packages = ["openciclo"]
pretty = true
disallow_untyped_defs = true
check_untyped_defs = true
warn_unused_ignores = true
no_implicit_optional = true
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
